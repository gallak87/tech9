name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'games/vulpine/src/**'
      - 'games/vulpine/index.html'
      - 'games/vulpine/package.json'
      - 'games/vulpine/package-lock.json'
      - 'games/vulpine/vite.config.js'
      - 'games/gravelrun/src/**'
      - 'games/snake/src/**'
      - 'games/skyrift/src/**'
      - 'games/void-sentinel/src/**'
      - 'games/orb-vacuum/src/**'
      - 'games/chronoforge/src/**'
      - 'games/chronoforge/package.json'
      - 'games/chronoforge/package-lock.json'
      - 'games/chronoforge/vite.config.js'
      - 'games/void-sentinel-breach/**'
      - 'games/chronoforge-dawn/src/**'
      - 'games/chronoforge-dawn/assets/**'
      - 'games/chronoforge-dawn/index.html'
      - 'games/chronoforge-dawn/package.json'
      - 'games/chronoforge-dawn/package-lock.json'
      - 'games/chronoforge-dawn/vite.config.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build vulpine
        # playwright is a devDependency for the screenshot tooling only; vite
        # still has to come from the dev tree, so skip the browser download
        # rather than the dev install.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          cd games/vulpine
          npm ci
          npm run build

      - name: Build chronoforge
        run: |
          cd games/chronoforge
          npm ci
          npm run build

      - name: Build orb vacuum
        run: |
          cd games/orb-vacuum
          npm ci
          npm run build

      - name: Build void-sentinel-breach
        run: |
          cd games/void-sentinel-breach
          npm ci
          npm run build

      - name: Build chronoforge-dawn
        # playwright is a devDependency for the capture harness only; vite has
        # to come from the dev tree, so skip the browser download rather than
        # the dev install.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          cd games/chronoforge-dawn
          npm ci
          npm run build
          # Kaida is graduated: there is no code-built fallback, so a dist
          # without her glb deploys a world with no player. vite.config.js's
          # forgeEmit plugin puts it there — fail here, not on the live site.
          test -f dist/assets/kaida.glb

      - name: Build site
        run: |
          mkdir -p _site/gravelrun _site/snake _site/skyrift _site/void-sentinel _site/orb-vacuum _site/void-sentinel-breach _site/chronoforge _site/chronoforge-dawn
          # vulpine is the front door; chronoforge keeps its own subpath (its
          # base is './', so it does not care where it is mounted).
          cp -r games/vulpine/dist/. _site/
          cp -r games/chronoforge/dist/. _site/chronoforge/
          cp -r games/chronoforge-dawn/dist/. _site/chronoforge-dawn/
          cp -r games/orb-vacuum/dist/. _site/orb-vacuum/
          cp -r games/void-sentinel-breach/dist/. _site/void-sentinel-breach/
          cp -r games/gravelrun/src/. _site/gravelrun/
          cp -r games/snake/src/. _site/snake/
          cp -r games/skyrift/src/. _site/skyrift/
          cp -r games/void-sentinel/src/. _site/void-sentinel/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
