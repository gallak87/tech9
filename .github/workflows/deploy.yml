name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'games/**'
      - 'worldkit/**'
      - '_archive/games/**'
      - 'tools/pages.mjs'
      - 'worldkit/tools/pages.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build committed browser games
        env:
          # Archive hosting is opt-in through a repository variable.
          INCLUDE_ARCHIVE_GAMES: ${{ vars.INCLUDE_ARCHIVE_GAMES || 'false' }}
        run: |
          if [ -f worldkit/tools/pages.mjs ]; then
            node worldkit/tools/pages.mjs
          else
            node tools/pages.mjs
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
