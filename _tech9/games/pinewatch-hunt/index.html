<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#222c27" />
    <meta
      name="description"
      content="Pinewatch Hunt — a quiet first-person bow hunt in a sunlit pine forest."
    />
    <title>Pinewatch Hunt</title>
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      aria-label="Pinewatch Hunt. WASD walk, Shift quiet approach, mouse or arrows look, Q aim, Space draw and release, E retrieve."
    ></canvas>
    <div id="interface"></div>
    <div id="world-hud" aria-label="World HUD"></div>
    <div id="loading" role="status">
      <span class="loading-mark">P / H</span
      ><span>Finding the light<span class="loading-dots">…</span></span
      ><small>PINEWATCH / NORTH RANGE</small>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
