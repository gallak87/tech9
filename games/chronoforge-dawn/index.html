<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chronoforge Dawn</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
    body { font-family: 'Bahnschrift', 'DIN Alternate', system-ui, sans-serif; }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    /* The HUD/menu layer. Owned by the `ui` lane; it never touches #stage. */
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* Boot backdrop in CSS so the first painted frame is not white. Removed by
       main.js once the renderer has presented. */
    #boot {
      position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 46%, #1a1220 0%, #0a0a14 55%, #04050a 100%);
      transition: opacity .35s ease;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="ui"></div>
  <div id="boot"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
