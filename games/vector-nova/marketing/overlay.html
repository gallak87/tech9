<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>VECTOR//NOVA — kinetic title layer</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #edf0e9;
        background: transparent;
        --red: #c41c1c;
        --paper: #edf0e9;
        --ink: #191919;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #overlay {
        position: fixed;
        inset: 0;
        isolation: isolate;
        pointer-events: none;
      }
      .layer {
        position: absolute;
        inset: 0;
        opacity: 0;
        visibility: hidden;
      }
      .heavy {
        font-weight: 900;
        letter-spacing: -0.075em;
        line-height: 0.84;
        white-space: nowrap;
      }
      .fragment {
        position: absolute;
        margin: 0;
        text-shadow: 3px 3px 0 var(--ink);
      }
      #intro-vector .fragment {
        left: 78px;
        top: 252px;
        font-size: 270px;
      }
      #intro-nova .fragment {
        right: 99px;
        top: 540px;
        font-size: 318px;
      }
      #slash svg {
        position: absolute;
        width: 500px;
        height: 1080px;
        left: 710px;
        top: 0;
        overflow: visible;
        fill: var(--red);
      }
      .wordmark {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 174px;
        text-shadow: 3px 3px 0 var(--ink);
      }
      .wordmark .slashes {
        color: var(--red);
        margin: 0 20px 0 8px;
        font-style: italic;
        letter-spacing: -0.13em;
      }
      #intro-wordmark .wordmark {
        transform: translateY(-3px);
      }
      #finish .wordmark {
        transform: translateY(-43px);
      }
      #finish .descriptor {
        position: absolute;
        left: 0;
        right: 0;
        top: 659px;
        margin: 0;
        text-align: center;
        color: var(--paper);
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.31em;
        line-height: 1;
        text-shadow: 2px 2px 0 var(--ink);
      }
      #race .fragment {
        left: 74px;
        top: 383px;
        font-size: 350px;
        letter-spacing: -0.085em;
      }
      #race .fragment em {
        color: var(--red);
        font-style: normal;
      }
      #backdrop {
        background: var(--ink);
      }
      #paper {
        background: var(--paper);
      }
    </style>
  </head>
  <body>
    <main id="overlay" aria-label="VECTOR//NOVA film titles">
      <div id="backdrop" class="layer" aria-hidden="true"></div>
      <div id="paper" class="layer" aria-hidden="true"></div>
      <div id="intro-vector" class="layer" aria-label="Vector">
        <p class="fragment heavy">VECTOR</p>
      </div>
      <div id="intro-nova" class="layer" aria-label="Nova">
        <p class="fragment heavy">NOVA</p>
      </div>
      <div id="slash" class="layer" aria-hidden="true">
        <svg viewBox="0 0 500 1080" xmlns="http://www.w3.org/2000/svg">
          <path d="M194-150h88L-118 1230h-88zM386-150h88L74 1230h-88z" />
        </svg>
      </div>
      <div id="intro-wordmark" class="layer" aria-label="Vector Nova">
        <div class="wordmark heavy">
          <span>VECTOR</span><span class="slashes">//</span><span>NOVA</span>
        </div>
      </div>
      <div id="race" class="layer" aria-label="Race">
        <p class="fragment heavy">RACE<em>.</em></p>
      </div>
      <div
        id="finish"
        class="layer"
        aria-label="Vector Nova, anti-gravity racing"
      >
        <div class="wordmark heavy">
          <span>VECTOR</span><span class="slashes">//</span><span>NOVA</span>
        </div>
        <p class="descriptor">ANTI-GRAVITY RACING</p>
      </div>
    </main>
    <script>
      (() => {
        const plates = [
          'intro-vector',
          'intro-nova',
          'slash',
          'intro-wordmark',
          'race',
          'finish',
        ];
        const ids = ['backdrop', 'paper', ...plates];
        const elements = Object.fromEntries(
          ids.map((id) => [id, document.getElementById(id)]),
        );
        const clamp = (value) => Math.max(0, Math.min(1, value));
        function reset() {
          for (const element of Object.values(elements)) {
            element.style.opacity = '0';
            element.style.visibility = 'hidden';
            element.style.transform = '';
          }
        }
        function show(id, opacity = 1, transform = '') {
          const element = elements[id];
          element.style.opacity = String(clamp(opacity));
          element.style.visibility = opacity > 0 ? 'visible' : 'hidden';
          element.style.transform = transform;
        }
        // Deterministic frame export: no timers, CSS transitions or wall-clock time.
        window.renderOverlay = (seconds) => {
          if (!Number.isFinite(seconds))
            throw new TypeError('A finite video time is required.');
          reset();
          if (seconds >= 2.466667 && seconds <= 3.35) {
            show('backdrop', 0.16);
          }
          if (seconds >= 14.6 && seconds <= 15) {
            show('backdrop', (seconds - 14.6) / 0.4);
          }
          if (seconds >= 40 / 60 && seconds < 42 / 60) {
            show('paper', 0.58);
          }
          if (seconds >= 0 && seconds <= 0.64) {
            const opacity =
              clamp(seconds / 0.1) * (1 - clamp((seconds - 0.52) / 0.12));
            show(
              'intro-vector',
              opacity,
              `translateX(${-280 * (1 - clamp(seconds / 0.2))}px)`,
            );
          }
          if (seconds >= 0.26 && seconds <= 1.1) {
            const opacity =
              clamp((seconds - 0.26) / 0.1) *
              (1 - clamp((seconds - 0.98) / 0.12));
            show(
              'intro-nova',
              opacity,
              `translateX(${280 * (1 - clamp((seconds - 0.26) / 0.2))}px)`,
            );
          }
          if (seconds >= 2.466667 && seconds <= 3.35) {
            const opacity =
              clamp((seconds - 2.466667) / 0.09) *
              (1 - clamp((seconds - 3.233333) / 0.116667));
            show('intro-wordmark', opacity);
          }
          for (const [start, end] of [
            [0.616667, 0.8],
            [6.85, 7.033333],
            [10.433333, 10.616667],
          ]) {
            if (seconds >= start && seconds <= end) {
              show(
                'slash',
                1,
                `translateX(${-2200 + (seconds - start) * 26000}px)`,
              );
            }
          }
          if (seconds >= 13.216667 && seconds <= 15) {
            show('finish', (seconds - 13.216667) / 0.12);
          }
          document.documentElement.dataset.time = String(seconds);
          return {
            time: seconds,
            visible: ids.filter(
              (id) => elements[id].style.visibility === 'visible',
            ),
          };
        };
        // Static plates for an editor/FFmpeg compositor. Only the selected layer
        // is visible; optional opaque charcoal applies to title holds, not gameplay.
        window.renderPlate = (id, options = {}) => {
          if (!plates.includes(id))
            throw new Error(`Unknown title plate: ${id}`);
          reset();
          if (options.opaque) show('backdrop');
          show(id);
          return { plate: id, opaque: Boolean(options.opaque) };
        };
        window.overlayPalette = {
          red: '#c41c1c',
          paper: '#edf0e9',
          ink: '#191919',
        };
        window.overlayPlates = plates;
        window.renderOverlay(0);
      })();
    </script>
  </body>
</html>
