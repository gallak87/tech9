# Copy to .github/workflows/dusk-pages.yml at the repository root.
name: Publish Chronoforge Dusk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'games/chronoforge-dusk-prototype/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dusk-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/chronoforge-dusk-prototype/package-lock.json
      - run: npm ci
        working-directory: games/chronoforge-dusk-prototype
      - run: npm run build
        working-directory: games/chronoforge-dusk-prototype
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/chronoforge-dusk-prototype/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
