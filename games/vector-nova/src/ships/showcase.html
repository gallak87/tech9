<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kestrel — asset inspection</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #202b32;
      color: #e4e8e5;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    aside {
      position: absolute;
      left: 5vw;
      top: 6vh;
      pointer-events: none;
    }
    p {
      font: 11px/1.8 monospace;
      letter-spacing: 0.17em;
      color: #aeb7b9;
    }
    h1 {
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.06em;
      margin: 9px 0;
    }
    small {
      position: absolute;
      bottom: 4vh;
      left: 5vw;
      font: 11px monospace;
      letter-spacing: 0.08em;
      color: #aeb7b9;
    }
  </style>
  <aside>
    <p>VECTOR // NOVA &nbsp; • &nbsp; AERODYNAMICS 07</p>
    <h1>KESTREL</h1>
    <p>CONCEPT 01 &nbsp; / &nbsp; BLENDER-AUTHORED RACING CHASSIS</p>
  </aside>
  <small
    >DRAG TO ORBIT &nbsp; / &nbsp; SCROLL TO INSPECT &nbsp; / &nbsp; ACTUAL GAME
    GEOMETRY</small
  >
  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js",
        "three/addons/": "/node_modules/three/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { createShip } from './index.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x27333b);
    const pmrem = new THREE.PMREMGenerator(renderer),
      room = new RoomEnvironment();
    const environment = pmrem.fromScene(room, 0.06);
    scene.environment = environment.texture;
    scene.environmentIntensity = 0.62;
    room.dispose();
    pmrem.dispose();
    const camera = new THREE.PerspectiveCamera(
      39,
      innerWidth / innerHeight,
      0.1,
      80,
    );
    camera.position.set(8.7, 7.0, 10.9);
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 0.65, 0);
    orbit.minDistance = 3;
    orbit.maxDistance = 22;
    orbit.maxPolarAngle = Math.PI * 0.49;
    orbit.update();
    const key = new THREE.DirectionalLight(0xfff4dc, 4.2);
    key.position.set(3, 8, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -6;
    key.shadow.normalBias = 0.02;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xa5cff4, 2.0);
    rim.position.set(-6, 4, -4);
    scene.add(rim);
    const ship = await createShip();
    ship.group.position.y = 0.68;
    scene.add(ship.group);
    ship.update({ speed: 0, time: 0 });
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({
        color: 0x344149,
        roughness: 0.79,
        metalness: 0.1,
      }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);
    window.__KESTREL = { ship, scene, camera, orbit, renderer, ready: false };
    await renderer.compileAsync(scene, camera);
    renderer.render(scene, camera);
    window.__KESTREL.ready = true;
    function frame() {
      orbit.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</html>
