<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake2</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0f;
    color: #e0e0ff;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }

  /* ── Score HUD ─────────────────────────────────────────────────── */
  .score-hud {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    width: 628px; /* (24*25) + (1*26 gaps) + (1px*2 padding) = 628 */
    margin-bottom: 8px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e0e0ff;
    text-shadow:
      0 0 6px #a0a0ff,
      0 0 14px #6060ff66;
  }

  .score-hud .label {
    color: #5050aa;
    font-weight: 400;
  }

  .score-hud .value {
    color: #e0e0ff;
  }

  .score-hud .value.score-bump {
    animation: score-bump 200ms ease-out 1;
  }

  @keyframes score-bump {
    0%   { color: #e0e0ff; text-shadow: 0 0 6px #a0a0ff; }
    40%  { color: #ffffff; text-shadow: 0 0 12px #ffffff, 0 0 24px #8080ff; }
    100% { color: #e0e0ff; text-shadow: 0 0 6px #a0a0ff; }
  }

  /* ── Grid wrapper ──────────────────────────────────────────────── */
  #grid-wrap {
    position: relative;
  }

  /* ── Grid ──────────────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(25, 24px);
    grid-template-rows: repeat(25, 24px);
    gap: 1px;
    background-color: #1a1a2e;
    padding: 1px;
    position: relative;
    overflow: hidden;
  }

  /* ── Flash animations (applied to .grid) ──────────────────────── */
  @keyframes flash-common {
    0%   { background-color: #0a0a0f; }
    30%  { background-color: #0d2010; }
    100% { background-color: #0a0a0f; }
  }

  .flash-common {
    animation: flash-common 300ms ease-out 1;
  }

  @keyframes flash-rare {
    0%   { background-color: #0a0a0f; filter: brightness(1); }
    20%  { background-color: #1a1200; filter: brightness(1.6); }
    60%  { background-color: #110e00; filter: brightness(1.2); }
    100% { background-color: #0a0a0f; filter: brightness(1); }
  }

  .flash-rare {
    animation: flash-rare 500ms ease-out 1;
  }

  @keyframes flash-legendary {
    0%   { background-color: #0a0a0f; filter: brightness(1) saturate(1); }
    8%   { background-color: #ffffff; filter: brightness(3.5) saturate(0); }
    20%  { background-color: #ff1010; filter: brightness(2.2) saturate(2); }
    50%  { background-color: #1a0000; filter: brightness(1.3) saturate(1.5); }
    100% { background-color: #0a0a0f; filter: brightness(1) saturate(1); }
  }

  .flash-legendary {
    animation: flash-legendary 800ms cubic-bezier(0.22, 1, 0.36, 1) 1;
  }

  /* ── Death state on .grid ──────────────────────────────────────── */
  @keyframes death-flash {
    0%   { filter: brightness(1) saturate(1) hue-rotate(0deg); }
    10%  { filter: brightness(2.5) saturate(0.2) hue-rotate(0deg); }
    25%  { filter: brightness(1.4) saturate(0) hue-rotate(-20deg); }
    100% { filter: brightness(0.55) saturate(0) hue-rotate(0deg); }
  }

  .grid.state-dead {
    animation: death-flash 700ms ease-out 1 forwards;
  }

  /* ── Death overlay (inside .grid) ─────────────────────────────── */
  .death-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,20,20,0.22) 0%, rgba(255,20,20,0.06) 70%, transparent 100%);
    pointer-events: none;
    opacity: 0;
    animation: death-overlay-in 400ms ease-out 100ms 1 forwards;
  }

  @keyframes death-overlay-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ── Cells ─────────────────────────────────────────────────────── */
  .cell {
    width: 24px;
    height: 24px;
    background-color: #0f0f1a;
    transition: background-color 60ms linear;
  }

  .cell-empty {
    background-color: #0f0f1a;
    box-shadow: none;
    border-radius: 0;
    border: none;
    transform: none;
    z-index: 0;
  }

  .cell-snake-head {
    background-color: #00ffcc;
    border-radius: 4px;
    border: 1px solid #80fff0;
    transform: scale(1.08);
    z-index: 2;
    box-shadow:
      0 0 6px 2px #00ffcc,
      0 0 18px 4px #00ffcc80,
      inset 0 0 4px #00ffff40;
  }

  .cell-snake-body {
    background-color: #00cc99;
    border-radius: 2px;
    border: 1px solid #00cc9944;
    transform: scale(1.0);
    z-index: 1;
    box-shadow:
      0 0 4px 1px #00cc9966,
      0 0 10px 2px #00cc9933;
  }

  .cell-pickup-common {
    background-color: #39ff14;
    border-radius: 50%;
    box-shadow:
      0 0 6px 2px #39ff14,
      0 0 16px 4px #39ff1466;
  }

  .cell-pickup-rare {
    background-color: #ffd700;
    border-radius: 3px;
    box-shadow:
      0 0 8px 3px #ffd700,
      0 0 22px 6px #ffd70055,
      0 0 40px 8px #ffaa0022;
  }

  .cell-pickup-legendary {
    background-color: #ff2020;
    border-radius: 2px;
    box-shadow:
      0 0 10px 4px #ff2020,
      0 0 28px 8px #ff202066,
      0 0 60px 14px #ff000033,
      inset 0 0 6px #ff606040;
  }

  /* ── Overlay (title / game over) ───────────────────────────────── */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    pointer-events: auto;
    z-index: 10;
    background: rgba(10, 10, 15, 0.82);
    backdrop-filter: blur(1px);
  }

  #overlay.hidden {
    display: none;
  }

  #overlay-title {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #00ffcc;
    text-shadow:
      0 0 12px #00ffcc,
      0 0 28px #00ffcc80;
    animation: title-pulse 2s ease-in-out infinite;
  }

  #overlay-title.gameover {
    color: #ff4444;
    text-shadow:
      0 0 12px #ff4444,
      0 0 28px #ff444480;
    animation: none;
  }

  @keyframes title-pulse {
    0%, 100% { text-shadow: 0 0 12px #00ffcc, 0 0 28px #00ffcc80; }
    50%       { text-shadow: 0 0 20px #00ffcc, 0 0 48px #00ffcccc, 0 0 64px #00ffcc44; }
  }

  #overlay-score {
    font-size: 15px;
    color: #ffffff;
    letter-spacing: 0.1em;
    display: none;
  }

  #overlay-sub {
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #888888;
    animation: blink 1.4s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }
</style>
</head>
<body>

<div class="score-hud">
  <span class="label">Snake2</span>
  <span class="value" id="score-value">0</span>
</div>

<div id="grid-wrap">
  <div class="grid" id="grid"></div>

  <div id="overlay">
    <div id="overlay-title">Snake2</div>
    <div id="overlay-score"></div>
    <div id="overlay-sub">Press any key to start</div>
  </div>
</div>

<script>
  // ── Constants ─────────────────────────────────────────────────────────────
  const COLS = 25;
  const ROWS = 25;
  const BASE_MS = 150;
  const DECREMENT_MS = 10;
  const FLOOR_MS = 60;

  const TIERS = {
    common:    { points: 10, growth: 1, flashClass: 'flash-common',    flashDur: 300, cellClass: 'cell-pickup-common'    },
    rare:      { points: 30, growth: 3, flashClass: 'flash-rare',      flashDur: 500, cellClass: 'cell-pickup-rare'      },
    legendary: { points: 100, growth: 6, flashClass: 'flash-legendary', flashDur: 800, cellClass: 'cell-pickup-legendary' },
  };

  const TIER_ORDER = ['common', 'rare', 'legendary'];

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const gridEl       = document.getElementById('grid');
  const overlay      = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlaySub   = document.getElementById('overlay-sub');
  const overlayScore = document.getElementById('overlay-score');
  const scoreValue   = document.getElementById('score-value');

  // ── Build grid cells ──────────────────────────────────────────────────────
  const cells = [];
  for (let r = 0; r < ROWS; r++) {
    cells[r] = [];
    for (let c = 0; c < COLS; c++) {
      const el = document.createElement('div');
      el.className = 'cell cell-empty';
      gridEl.appendChild(el);
      cells[r][c] = el;
    }
  }

  // death overlay div (inside grid, hidden until death)
  const deathOverlayEl = document.createElement('div');
  deathOverlayEl.className = 'death-overlay';
  deathOverlayEl.style.display = 'none';
  gridEl.appendChild(deathOverlayEl);

  // ── Game state ────────────────────────────────────────────────────────────
  // States: 'idle' | 'playing' | 'dead'
  let state = 'idle';
  let snake = [];          // [{x, y}, ...] index 0 = head
  let dir = { x: 1, y: 0 }; // active direction
  let dirBuf = null;         // buffered input (depth-1)
  let score = 0;
  let pendingGrowth = 0;
  let pickup = null;         // { x, y, tier }
  let tickTimer = null;

  // ── Speed ─────────────────────────────────────────────────────────────────
  function tickInterval() {
    return Math.max(FLOOR_MS, BASE_MS - Math.floor(score / 50) * DECREMENT_MS);
  }

  // ── Score display ─────────────────────────────────────────────────────────
  function updateScore(n) {
    score = n;
    scoreValue.textContent = score;
    // bump animation — force reflow to restart it
    scoreValue.classList.remove('score-bump');
    void scoreValue.offsetWidth;
    scoreValue.classList.add('score-bump');
    scoreValue.addEventListener('animationend', () => scoreValue.classList.remove('score-bump'), { once: true });
  }

  // ── Cell rendering ────────────────────────────────────────────────────────
  function setCellClass(x, y, cls) {
    cells[y][x].className = 'cell ' + cls;
  }

  function renderState() {
    // Clear all cells
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        cells[r][c].className = 'cell cell-empty';

    // Draw pickup
    if (pickup) {
      setCellClass(pickup.x, pickup.y, TIERS[pickup.tier].cellClass);
    }

    // Draw snake (body first, then head overwrites)
    for (let i = snake.length - 1; i >= 1; i--) {
      setCellClass(snake[i].x, snake[i].y, 'cell-snake-body');
    }
    if (snake.length > 0) {
      setCellClass(snake[0].x, snake[0].y, 'cell-snake-head');
    }
  }

  // ── Flash ─────────────────────────────────────────────────────────────────
  let flashTimer = null;
  function triggerFlash(tier) {
    const { flashClass, flashDur } = TIERS[tier];
    gridEl.classList.remove('flash-common', 'flash-rare', 'flash-legendary');
    void gridEl.offsetWidth; // reflow to restart animation
    gridEl.classList.add(flashClass);
    if (flashTimer) clearTimeout(flashTimer);
    flashTimer = setTimeout(() => gridEl.classList.remove(flashClass), flashDur);
  }

  // ── Spawn pickup ──────────────────────────────────────────────────────────
  function spawnPickup(tier) {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    const empty = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (!occupied.has(`${c},${r}`)) empty.push({ x: c, y: r });

    if (empty.length === 0) {
      pickup = null;
      return;
    }
    const cell = empty[Math.floor(Math.random() * empty.length)];
    pickup = { x: cell.x, y: cell.y, tier };
  }

  function nextTier(eaten) {
    if (eaten === 'legendary') return 'common'; // legendary doesn't promote
    const idx = TIER_ORDER.indexOf(eaten);
    if (Math.random() < 0.20) return TIER_ORDER[idx + 1];
    return 'common';
  }

  // ── Init game state ───────────────────────────────────────────────────────
  function resetState() {
    snake = [
      { x: 12, y: 12 }, // head — center of 25×25
      { x: 11, y: 12 },
      { x: 10, y: 12 },
    ];
    dir = { x: 1, y: 0 };
    dirBuf = null;
    score = 0;
    scoreValue.textContent = '0';
    scoreValue.classList.remove('score-bump');
    pendingGrowth = 0;
    pickup = null;
  }

  // ── Tick ──────────────────────────────────────────────────────────────────
  function tick() {
    if (state !== 'playing') return;

    // 1. Consume buffered input
    if (dirBuf) {
      dir = dirBuf;
      dirBuf = null;
    }

    // 2. Try to spawn pickup if none exists (grid-full recovery)
    if (!pickup) spawnPickup('common');

    // 3. Compute new head
    const newHead = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 4. Check death
    const wallDead = newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS;
    const selfDead = !wallDead && snake.some(s => s.x === newHead.x && s.y === newHead.y);

    if (wallDead || selfDead) {
      die();
      return;
    }

    // 5. Move
    snake.unshift(newHead);

    // 6. Check pickup
    const ate = pickup && newHead.x === pickup.x && newHead.y === pickup.y;

    if (ate) {
      const tier = pickup.tier;
      const tierDef = TIERS[tier];

      // Score
      updateScore(score + tierDef.points);

      // Growth: pendingGrowth accumulates (tail skip)
      pendingGrowth += tierDef.growth - 1; // -1 because we already kept the head (no tail removal this tick)
      // We do NOT remove tail this tick (ate a pickup)

      // Flash
      triggerFlash(tier);

      // Spawn next pickup
      spawnPickup(nextTier(tier));
    } else {
      // No pickup eaten
      if (pendingGrowth > 0) {
        pendingGrowth--;
        // Don't remove tail (growing)
      } else {
        snake.pop();
      }
    }

    renderState();

    // Schedule next tick with updated interval
    tickTimer = setTimeout(tick, tickInterval());
  }

  // ── Death ─────────────────────────────────────────────────────────────────
  function die() {
    state = 'dead';

    // Apply death visual to grid
    gridEl.classList.add('state-dead');

    // Show death overlay inside grid
    deathOverlayEl.style.display = '';
    deathOverlayEl.style.animation = 'none';
    void deathOverlayEl.offsetWidth;
    deathOverlayEl.style.animation = '';

    // Show overlay text
    overlayTitle.textContent = 'GAME OVER';
    overlayTitle.classList.add('gameover');
    overlayScore.textContent = `Score: ${score}`;
    overlayScore.style.display = 'block';
    overlaySub.textContent = 'Press any key to restart';
    overlay.classList.remove('hidden');

    renderState();
  }

  // ── Go IDLE ───────────────────────────────────────────────────────────────
  function goIdle() {
    state = 'idle';

    if (tickTimer) { clearTimeout(tickTimer); tickTimer = null; }

    // Clean up death visuals
    gridEl.classList.remove('state-dead');
    gridEl.classList.remove('flash-common', 'flash-rare', 'flash-legendary');
    deathOverlayEl.style.display = 'none';

    resetState();

    // Static 3-segment snake in center, facing right
    renderState();

    // Show idle overlay
    overlayTitle.textContent = 'Snake2';
    overlayTitle.classList.remove('gameover');
    overlayScore.style.display = 'none';
    overlaySub.textContent = 'Press any key to start';
    overlay.classList.remove('hidden');
  }

  // ── Start PLAYING ─────────────────────────────────────────────────────────
  function startPlaying() {
    state = 'playing';

    overlay.classList.add('hidden');

    // Spawn first pickup
    spawnPickup('common');
    renderState();

    tickTimer = setTimeout(tick, tickInterval());
  }

  // ── Input ─────────────────────────────────────────────────────────────────
  const DIR_MAP = {
    ArrowUp:    { x:  0, y: -1 },
    ArrowDown:  { x:  0, y:  1 },
    ArrowLeft:  { x: -1, y:  0 },
    ArrowRight: { x:  1, y:  0 },
    w: { x:  0, y: -1 },
    W: { x:  0, y: -1 },
    s: { x:  0, y:  1 },
    S: { x:  0, y:  1 },
    a: { x: -1, y:  0 },
    A: { x: -1, y:  0 },
    d: { x:  1, y:  0 },
    D: { x:  1, y:  0 },
  };

  function isOpposite(a, b) {
    return a.x === -b.x && a.y === -b.y;
  }

  document.addEventListener('keydown', (e) => {
    if (state === 'idle') {
      startPlaying();
      // If the key is also a direction key, buffer it
      const mapped = DIR_MAP[e.key];
      if (mapped && !isOpposite(mapped, dir)) {
        dirBuf = mapped;
      }
      if (DIR_MAP[e.key]) e.preventDefault();
      return;
    }

    if (state === 'dead') {
      goIdle();
      return;
    }

    if (state === 'playing') {
      const mapped = DIR_MAP[e.key];
      if (mapped) {
        e.preventDefault();
        // 180° reversal check against active dir
        if (!isOpposite(mapped, dir)) {
          dirBuf = mapped;
        }
      }
    }
  });

  // Click on grid-wrap to start/restart
  document.getElementById('grid-wrap').addEventListener('pointerdown', () => {
    if (state === 'idle') {
      startPlaying();
    } else if (state === 'dead') {
      goIdle();
    }
  });

  // ── Boot ──────────────────────────────────────────────────────────────────
  goIdle();
</script>
</body>
</html>
